<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fart Harp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=JetBrains+Mono:wght@500;800&display=swap">
<style>
  /* Layout: the word fills the whole screen like harp strings; one thin mono control line underneath.
     Two colours at a time. They trade places on every note, and each sound brings its own pair. */
  :root {
    --bg: #ffffff;              /* both set by the script */
    --fg: #e3120b;
    --display: "Bungee", "Arial Black", Impact, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    font-weight: 500;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.3rem;
    box-sizing: border-box;
    padding-block: 0.3rem 0.4rem;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #hint {
    margin: 0;
    text-align: center;
    text-wrap: balance;
    line-height: 1.35;
  }
  #stage {
    flex: 1;
    min-height: 0;
    width: 100%;
    max-width: 1100px;
    touch-action: none;
    cursor: grab;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .bar {
    width: 100%;
    max-width: 1100px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
  }
  .bar label, .bar .pick { display: flex; align-items: baseline; gap: 0.6em; min-width: 0; }
  .bar input, .bar button {
    font-family: inherit;
    font-weight: 800;
    font-size: 16px;            /* below 16px an iPhone zooms the page when you type */
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--fg);
    background: transparent;
    border: 0;
    border-bottom: 2px solid var(--fg);
    border-radius: 0;
    margin: 0;
    padding: 0 0 1px;
  }
  .bar input { width: 11ch; -webkit-user-select: text; user-select: text; }
  .bar button { cursor: pointer; touch-action: manipulation; }
  .bar input:focus-visible, .bar button:focus-visible { outline: 2px solid var(--fg); outline-offset: 4px; }
</style>
</head>
<body>
<p id="hint">Tap for sound. Strum soft or fast, or grab a letter and pull</p>
<div id="stage"><canvas id="harp" aria-label="A word whose letters play like harp strings"></canvas></div>
<div class="bar">
  <label for="word-input">word
    <input id="word-input" type="text" value="LAME" maxlength="10" autocomplete="off" autocapitalize="characters" spellcheck="false">
  </label>
  <span class="pick">sound
    <button id="sound-btn" type="button" aria-label="Change the sound">FART</button>
  </span>
</div>

<script>
(() => {
  const PENTATONIC = [0, 2, 4, 7, 9];
  // A plucked letter vibrates as a sum of standing waves, like a real string.
  const MODES = [1, 2, 3, 4, 5].map(n => ({
    n, omega: 2 * Math.PI * 2.6 * n, damp: 1.0 + 0.45 * n
  }));
  const SHUTTER = 0.05;      // seconds of movement smeared into each frame

  const stage = document.getElementById('stage');
  const canvas = document.getElementById('harp');
  const ctx = canvas.getContext('2d');
  const cur = document.createElement('canvas');      // this frame's letters
  const cctx = cur.getContext('2d');
  const trail = document.createElement('canvas');    // fading ghosts of earlier frames
  const tctx = trail.getContext('2d');
  const hint = document.getElementById('hint');
  const input = document.getElementById('word-input');
  const soundBtn = document.getElementById('sound-btn');
  const root = document.documentElement;

  let letters = [];
  let W = 0, H = 0, dpr = 1;
  let running = false, lastT = 0;
  let flipped = 0, mix = 0;          // 0 = word in colour b on a, 1 = the other way round
  let blush = 0;                     // brief lean toward the other colour after a soft note
  const HARD = 0.6;                  // notes at least this strong swap the colours outright
  let fgNow = [0, 0, 0];

  /* ---------- notes ---------- */
  // Each letter of the alphabet owns a note: two octaves of a pentatonic scale.
  function freqFor(ch) {
    const code = ch.toUpperCase().charCodeAt(0);
    const n = (code >= 65 && code <= 90 ? code - 65 : code) % 10;
    const semi = PENTATONIC[n % 5] + 12 * Math.floor(n / 5);
    return 87.31 * Math.pow(2, semi / 12);
  }

  /* ---------- sound ---------- */
  let ac = null, master = null, noiseBuf = null, shaperCurve = null;
  let silentEl = null, awake = false;

  // One second of silence as a WAV. Keeping it playing in an <audio> element makes
  // iPhones play Web Audio even when the ring/silent switch is set to silent.
  function silentWav() {
    const n = 8000, b = new Uint8Array(44 + n), v = new DataView(b.buffer);
    const str = (o, s) => { for (let i = 0; i < s.length; i++) b[o + i] = s.charCodeAt(i); };
    str(0, 'RIFF'); v.setUint32(4, 36 + n, true); str(8, 'WAVEfmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 8000, true); v.setUint32(28, 8000, true);
    v.setUint16(32, 1, true); v.setUint16(34, 8, true);
    str(36, 'data'); v.setUint32(40, n, true);
    b.fill(128, 44);
    let s = '';
    for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
    return 'data:audio/wav;base64,' + btoa(s);
  }

  // Must run inside a real tap/click/key handler for the browser to allow sound.
  function unlock() {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { hint.textContent = 'This browser cannot make sound'; return; }
      ac = new AC();
      master = ac.createDynamicsCompressor();
      master.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      shaperCurve = new Float32Array(1024);
      for (let i = 0; i < 1024; i++) shaperCurve[i] = Math.tanh((i / 511.5 - 1) * 3);
      ac.onstatechange = () => { if (ac.state === 'running') onAwake(); };
    }
    if (!silentEl) {
      try {
        silentEl = new Audio(silentWav());
        silentEl.loop = true;
        silentEl.setAttribute('playsinline', '');
      } catch (e) { silentEl = null; }
    }
    if (silentEl && silentEl.paused) { const p = silentEl.play(); if (p) p.catch(() => {}); }
    if (ac.state !== 'running') {
      const p = ac.resume();
      if (p) p.then(onAwake, () => {});
      // an empty buffer started inside the gesture is what older iOS needs
      const s = ac.createBufferSource();
      s.buffer = ac.createBuffer(1, 1, ac.sampleRate);
      s.connect(ac.destination);
      s.start(0);
    } else onAwake();
  }
  function onAwake() {
    if (awake || !ac || ac.state !== 'running') return;
    awake = true;
    hint.hidden = true;          // give the letters the whole screen
    SOUNDS[mode].play(130.8, 0.5, 0.6);       // so you can hear that sound is on
  }
  const ready = () => ac && ac.state === 'running';

  // Volume envelope shared by the simple voices.
  function env(t, attack, dur, peak) {
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    g.connect(master);
    return g;
  }
  function voice(type, t, dur, dest) {
    const o = ac.createOscillator();
    o.type = type;
    o.connect(dest);
    o.start(t);
    o.stop(t + dur + 0.05);
    return o;
  }

  // A fart: a buzzy low saw that sags in pitch, with noise wobbling its pitch and volume.
  function fart(freq, strength, bright) {
    if (!ready()) return;
    const t = ac.currentTime + 0.005;
    const dur = (0.12 + 0.65 * strength) * (0.75 + Math.random() * 0.5);
    const f0 = freq * (1 + (Math.random() - 0.5) * 0.04);

    const osc = ac.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(f0 * 1.2, t);
    osc.frequency.exponentialRampToValueAtTime(f0, t + 0.05);
    osc.frequency.exponentialRampToValueAtTime(f0 * (0.62 + Math.random() * 0.2), t + dur);

    const noise = ac.createBufferSource();
    noise.buffer = noiseBuf;
    noise.loop = true;
    const flutter = ac.createBiquadFilter();
    flutter.type = 'lowpass';
    flutter.frequency.value = 35;
    const toPitch = ac.createGain();
    toPitch.gain.value = f0 * 1.1;
    noise.connect(flutter);
    flutter.connect(toPitch);
    toPitch.connect(osc.frequency);

    const drive = ac.createGain();
    drive.gain.value = 2.5;
    const shaper = ac.createWaveShaper();
    shaper.curve = shaperCurve;
    const lp = ac.createBiquadFilter();    // kept bright enough for a phone speaker
    lp.type = 'lowpass';
    lp.Q.value = 4;
    lp.frequency.setValueAtTime(1100 + 1700 * bright, t);
    lp.frequency.exponentialRampToValueAtTime(450, t + dur);

    const amp = ac.createGain();
    const peak = 0.1 + 0.85 * strength;
    amp.gain.setValueAtTime(0.0001, t);
    amp.gain.exponentialRampToValueAtTime(peak, t + 0.012);
    amp.gain.setValueAtTime(peak, t + dur * 0.55);
    amp.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const sputter = ac.createGain();
    sputter.gain.value = peak * 2.5;
    flutter.connect(sputter);
    sputter.connect(amp.gain);

    const air = ac.createBiquadFilter();
    air.type = 'bandpass';
    air.frequency.value = f0 * 6;
    air.Q.value = 1.5;
    const airGain = ac.createGain();
    airGain.gain.value = 0.3;
    noise.connect(air);
    air.connect(airGain);
    airGain.connect(amp);

    osc.connect(drive);
    drive.connect(shaper);
    shaper.connect(lp);
    lp.connect(amp);
    amp.connect(master);

    osc.start(t);
    noise.start(t, Math.random() * 1.5);
    osc.stop(t + dur + 0.05);
    noise.stop(t + dur + 0.05);
    osc.onended = () => amp.disconnect();
  }

  // A plucked string: bright at the start, mellowing as it rings out.
  function harp(freq, strength, bright) {
    if (!ready()) return;
    const t = ac.currentTime + 0.005, f = freq * 2, dur = 0.5 + 1.7 * strength;
    const g = env(t, 0.004, dur, 0.05 + 0.6 * strength);
    const lp = ac.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(f * (4 + 8 * bright), t);
    lp.frequency.exponentialRampToValueAtTime(f * 1.5, t + dur * 0.6);
    lp.connect(g);
    for (const [type, mult, level] of [['triangle', 1, 1], ['sawtooth', 1.003, 0.25], ['sine', 2, 0.3]]) {
      const lv = ac.createGain();
      lv.gain.value = level;
      lv.connect(lp);
      voice(type, t, dur, lv).frequency.value = f * mult;
    }
    setTimeout(() => g.disconnect(), (dur + 0.2) * 1000);
  }

  // A spring: the pitch wobbles hard, then settles.
  function boing(freq, strength, bright) {
    if (!ready()) return;
    const t = ac.currentTime + 0.005, f = freq * 2, dur = 0.25 + 0.95 * strength;
    const g = env(t, 0.006, dur, 0.07 + 0.73 * strength);
    const o = voice('triangle', t, dur, g);
    o.frequency.setValueAtTime(f * 0.8, t);
    o.frequency.exponentialRampToValueAtTime(f * 1.3, t + dur);
    const depth = ac.createGain();
    depth.gain.setValueAtTime(f * (0.08 + 0.45 * strength), t);
    depth.gain.exponentialRampToValueAtTime(f * 0.01, t + dur);
    depth.connect(o.frequency);
    voice('sine', t, dur, depth).frequency.value = 7 + 10 * bright;
    o.onended = () => g.disconnect();
  }

  // A toy laser: a square wave falling fast from very high.
  function pew(freq, strength, bright) {
    if (!ready()) return;
    const t = ac.currentTime + 0.005, dur = 0.1 + 0.4 * strength;
    const g = env(t, 0.003, dur, 0.03 + 0.29 * strength);
    const o = voice('square', t, dur, g);
    o.frequency.setValueAtTime(freq * (10 + 10 * bright), t);
    o.frequency.exponentialRampToValueAtTime(freq * 1.2, t + dur);
    o.onended = () => g.disconnect();
  }

  // Each sound brings its own two colours: a = page, b = word (until a note swaps them).
  const SOUNDS = [
    { name: 'FART',  a: [255, 255, 255], b: [227, 18, 11],  play: fart },
    { name: 'HARP',  a: [255, 246, 176], b: [91, 33, 182],  play: harp },
    { name: 'BOING', a: [255, 214, 232], b: [14, 60, 255],  play: boing },
    { name: 'PEW',   a: [184, 255, 224], b: [18, 18, 58],   play: pew }
  ];
  let mode = 0;

  // The rising whine of a letter being stretched.
  function whineStart(L) {
    if (!ready()) return null;
    const g = ac.createGain();
    g.gain.value = 0;
    g.connect(master);
    const o = ac.createOscillator();
    o.type = 'triangle';
    o.frequency.value = L.freq * 2;
    o.connect(g);
    o.start();
    return { o, g };
  }
  function whineSet(L, frac) {
    const w = L.held && L.held.whine;
    if (!w) return;
    const t = ac.currentTime;
    w.o.frequency.setTargetAtTime(L.freq * 2 * (1 + 1.4 * frac), t, 0.03);
    w.g.gain.setTargetAtTime(0.16 * Math.pow(frac, 1.5), t, 0.03);
  }
  function whineStop(w) {
    if (!w) return;
    const t = ac.currentTime;
    w.g.gain.setTargetAtTime(0, t, 0.015);
    w.o.stop(t + 0.12);
    w.o.onended = () => w.g.disconnect();
  }

  /* ---------- letters ---------- */
  function seeded(i, salt) {
    const x = Math.sin((i + 1) * 127.1 + salt * 311.7) * 43758.5453;
    return x - Math.floor(x);
  }

  function build() {
    const cw0 = stage.clientWidth, ch0 = stage.clientHeight;
    if (!cw0 || !ch0) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.width = cur.width = trail.width = Math.round(cw0 * dpr);
    H = canvas.height = cur.height = trail.height = Math.round(ch0 * dpr);

    const chars = [...input.value.toUpperCase()].filter(c => c.trim());
    const old = letters;
    for (const L of old) if (L.held) { whineStop(L.held.whine); L.held = null; }
    letters = [];
    if (!chars.length) { draw(0, true); return; }

    const FS = 200;
    const font = `${FS}px "Bungee", "Arial Black", Impact, sans-serif`;
    ctx.font = font;
    const metrics = chars.map(c => {
      const m = ctx.measureText(c);
      return {
        l: m.actualBoundingBoxLeft, a: m.actualBoundingBoxAscent,
        w: Math.max(1, m.actualBoundingBoxLeft + m.actualBoundingBoxRight),
        h: Math.max(1, m.actualBoundingBoxAscent + m.actualBoundingBoxDescent)
      };
    });
    const avg = metrics.reduce((s, m) => s + m.w, 0) / metrics.length;
    const rel = metrics.map(m => Math.min(1.3, Math.max(0.6, m.w / avg)));
    const relSum = rel.reduce((s, r) => s + r, 0);

    const padX = W * 0.03, padY = H * 0.004;
    const gap = W * 0.02;
    const innerW = W - padX * 2 - gap * (chars.length - 1);
    const innerH = H - padY * 2;
    const m = 2;                                // margin around each letter bitmap
    let x = padX;

    chars.forEach((ch, i) => {
      const cw = innerW * rel[i] / relSum;
      const chh = innerH * (0.965 + 0.035 * seeded(i, 1));
      const y = padY + (innerH - chh) * seeded(i, 2);
      const g = metrics[i];
      const ow = Math.ceil(cw + m * 2), oh = Math.ceil(chh + m * 2);

      const mask = document.createElement('canvas');
      mask.width = ow; mask.height = oh;
      const mc = mask.getContext('2d');
      mc.translate(m, m);
      mc.scale(cw / g.w, chh / g.h);
      mc.font = font;
      mc.fillText(ch, g.l, g.a);

      const prev = old[i] && old[i].ch === ch ? old[i] : null;
      letters.push({
        ch, freq: freqFor(ch), x, y, w: cw, h: chh, m, ow, oh, mask, held: null,
        mx: prev ? prev.mx : MODES.map(() => 0),
        mv: prev ? prev.mv : MODES.map(() => 0)
      });
      x += cw + gap;
    });
    draw(0, true);
  }

  /* ---------- drawing ---------- */
  function drawLetters(c) {
    c.globalCompositeOperation = 'source-over';
    c.globalAlpha = 1;
    c.clearRect(0, 0, W, H);
    c.globalCompositeOperation = 'lighter';
    const step = Math.max(2, Math.round(dpr * 1.5));
    for (const L of letters) {
      const x0 = L.x - L.m, y0 = L.y - L.m;
      const moving = L.mx.some(v => v) || L.mv.some(v => v);
      if (!moving && !L.held) { c.globalAlpha = 1; c.drawImage(L.mask, x0, y0); continue; }
      // fast letters are drawn three times across the distance they covered
      const smear = L.mv.reduce((s, v) => s + Math.abs(v), 0) * SHUTTER;
      const S = smear < 1.5 * dpr ? 1 : 3;
      c.globalAlpha = 1 / S;
      const pull = L.held ? L.held.pull : 0, hp = L.held ? L.held.py : 0.5;
      for (let sy = 0; sy < L.oh; sy += step) {
        const t = Math.min(1, Math.max(0, (sy + step / 2 - L.m) / L.h));
        let dx = pull * (t < hp ? t / hp : (1 - t) / (1 - hp)), vx = 0;
        for (let k = 0; k < MODES.length; k++) {
          const sn = Math.sin(MODES[k].n * Math.PI * t);
          dx += L.mx[k] * sn;
          vx += L.mv[k] * sn;
        }
        // like rubber, a letter gets thinner where it is stretched furthest
        const thin = Math.max(0.3, 1 / (1 + 0.38 * Math.abs(dx) / L.w));
        const dw = L.ow * thin, xs = x0 + dx + (L.ow - dw) / 2;
        const sh = Math.min(step, L.oh - sy);
        for (let j = 0; j < S; j++) {
          const off = S === 1 ? 0 : vx * SHUTTER * (j / (S - 1) - 0.5);
          c.drawImage(L.mask, 0, sy, L.ow, sh, xs + off, y0 + sy, dw, sh);
        }
      }
    }
    c.globalAlpha = 1;
  }

  function draw(dt, idle) {
    drawLetters(cctx);

    // ghosts: the trail canvas keeps earlier frames and lets them fade
    tctx.globalAlpha = 1;
    if (idle) {
      tctx.globalCompositeOperation = 'source-over';
      tctx.clearRect(0, 0, W, H);
    } else {
      tctx.globalCompositeOperation = 'destination-out';
      tctx.globalAlpha = 1 - Math.exp(-dt * 7);
      tctx.fillRect(0, 0, W, H);
      tctx.globalAlpha = 1;
      tctx.globalCompositeOperation = 'lighter';
      tctx.drawImage(cur, 0, 0);
    }

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.clearRect(0, 0, W, H);
    if (!idle) { ctx.globalAlpha = 0.5; ctx.drawImage(trail, 0, 0); ctx.globalAlpha = 1; }
    ctx.drawImage(cur, 0, 0);
    // paint everything in the current word colour
    ctx.globalCompositeOperation = 'source-in';
    ctx.fillStyle = `rgb(${fgNow.join(',')})`;
    ctx.fillRect(0, 0, W, H);
  }

  function applyColours() {
    const P = SOUNDS[mode];
    // a pulled letter leans the page toward the other colour before it lets go
    let tension = 0;
    for (const L of letters) if (L.held) tension = Math.max(tension, Math.abs(L.held.pull) / maxPull(L));
    const shown = mix + (flipped ? -1 : 1) * Math.min(0.45, 0.42 * tension + blush);
    const bg = P.a.map((a, i) => Math.round(a + (P.b[i] - a) * shown));
    fgNow = shown < 0.5 ? P.b : P.a;
    root.style.setProperty('--bg', `rgb(${bg.join(',')})`);
    root.style.setProperty('--fg', `rgb(${fgNow.join(',')})`);
  }

  function frame(now) {
    const dt = Math.min(0.033, (now - lastT) / 1000 || 0.016);
    lastT = now;
    let alive = false;

    if (mix !== flipped) {
      mix += (flipped - mix) * (1 - Math.exp(-dt * 11));
      if (Math.abs(flipped - mix) < 0.004) mix = flipped; else alive = true;
    }
    if (blush) {
      blush *= Math.exp(-dt * 4.5);
      if (blush < 0.004) blush = 0; else alive = true;
    }
    applyColours();

    for (const L of letters) {
      if (L.held) alive = true;
      for (let k = 0; k < MODES.length; k++) {
        const M = MODES[k];
        let x = L.mx[k], v = L.mv[k];
        for (let s = 0; s < 6; s++) {
          const h = dt / 6;
          v += (-M.omega * M.omega * x - 2 * M.damp * v) * h;
          x += v * h;
        }
        if (Math.abs(x) < 0.04 && Math.abs(v) < 1.5) { x = 0; v = 0; } else alive = true;
        L.mx[k] = x; L.mv[k] = v;
      }
    }
    if (alive) { calm = 0; } else calm++;
    // keep drawing for a moment after everything stops so the ghosts can fade out
    const idle = calm > 40;
    draw(dt, idle);
    if (!idle) requestAnimationFrame(frame);
    else running = false;
  }
  let calm = 0;
  function wake() {
    calm = 0;
    if (running) return;
    running = true;
    lastT = performance.now();
    requestAnimationFrame(frame);
  }

  /* ---------- playing ---------- */
  // A letter can be dragged almost half the screen before it slips off the finger.
  function maxPull(L) { return Math.max(W * 0.45, L.w * 1.5); }
  const clampY = (L, y) => Math.min(0.88, Math.max(0.12, (y - L.y) / L.h));

  function kick(L, dir, amp, py) {
    for (let k = 0; k < MODES.length; k++) {
      const M = MODES[k];
      const weight = Math.sin(M.n * Math.PI * py) / Math.pow(M.n, 0.45);
      const cap = M.omega * L.w * 0.7;
      L.mv[k] = Math.max(-cap, Math.min(cap, L.mv[k] + dir * M.omega * amp * weight));
    }
  }

  // Every note: the two colours trade places, the letter sounds, and a shockwave
  // rolls outward through the rest of the word.
  function sound(L, dir, strength, py, shock) {
    if (strength >= HARD) { flipped = flipped ? 0 : 1; blush = 0; }
    else blush = Math.max(blush, 0.04 + 0.5 * strength);
    const octave = py < 0.33 ? 2 : 1;          // the top third of a letter plays an octave up
    SOUNDS[mode].play(L.freq * octave, strength, 1 - py);
    const i = letters.indexOf(L);
    letters.forEach((N, j) => {
      const d = Math.abs(j - i);
      if (!d) return;
      setTimeout(() => {
        if (N.held || !letters.includes(N)) return;
        kick(N, dir, N.w * shock / d, py);
        wake();
      }, d * 55);
    });
    wake();
  }

  function pluck(L, dir, strength, ty) {
    const py = Math.min(0.88, Math.max(0.12, ty));
    kick(L, dir, L.w * (0.03 + 0.85 * strength), py);
    sound(L, dir, strength, py, 0.3 * strength * strength);
  }

  // Let go of a pulled letter: its bent shape becomes the starting point of the vibration.
  function release(L) {
    const h = L.held;
    if (!h) return;
    L.held = null;
    whineStop(h.whine);
    if (Math.abs(h.pull) < 5 * dpr) { pluck(L, h.side, 0.2, h.py); return; }   // a plain tap is a soft note
    for (let k = 0; k < MODES.length; k++) {
      const n = MODES[k].n;
      L.mx[k] = h.pull * 2 * Math.sin(n * Math.PI * h.py) / (n * n * Math.PI * Math.PI * h.py * (1 - h.py));
      L.mv[k] = 0;
    }
    const frac = Math.abs(h.pull) / maxPull(L);
    sound(L, h.pull > 0 ? -1 : 1, Math.min(1, 0.05 + 1.3 * frac), h.py, 1.4 * Math.pow(frac, 1.5));
  }

  const pointers = new Map();   // one entry per finger (or the mouse)
  function toCanvas(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * dpr, y: (e.clientY - r.top) * dpr, t: e.timeStamp };
  }
  function inColumn(L, y) {
    return y > L.y - L.h * 0.04 && y < L.y + L.h * 1.04;
  }

  window.addEventListener('pointermove', e => {
    const p = toCanvas(e);
    let rec = pointers.get(e.pointerId);
    if (!rec) { rec = { last: null, grab: null, gx: 0 }; pointers.set(e.pointerId, rec); }
    const last = rec.last;
    rec.last = p;

    if (rec.grab) {
      const L = rec.grab;
      if (!L.held) rec.grab = null;
      else {
        L.held.pull = p.x - rec.gx;
        L.held.py = clampY(L, p.y);                    // the bend follows the finger up and down
        const frac = Math.abs(L.held.pull) / maxPull(L);
        if (frac > 1) {                                // pulled too far: it slips off the finger
          L.held.pull = Math.sign(L.held.pull) * maxPull(L);
          release(L);
          rec.grab = null;
        } else { whineSet(L, frac); wake(); }
      }
    }
    // crossing any letter that is not being held strums it, even while pulling another
    if (last && p.t - last.t < 250) {
      const speed = Math.abs(p.x - last.x) / dpr / Math.max(1, p.t - last.t);   // css px per ms
      const strength = Math.min(1, Math.max(0.03, speed / 3));
      const dir = p.x > last.x ? 1 : -1;
      const hit = letters.filter(L => {
        const cx = L.x + L.w / 2;
        return !L.held && (last.x - cx) * (p.x - cx) < 0 && inColumn(L, p.y);
      });
      if (dir < 0) hit.reverse();
      for (const L of hit) pluck(L, dir, strength, (p.y - L.y) / L.h);
    }
  });

  // Press on a letter to grab it, drag to pull it, let go to twang it.
  stage.addEventListener('pointerdown', e => {
    const p = toCanvas(e);
    const rec = { last: p, grab: null, gx: p.x };
    pointers.set(e.pointerId, rec);
    const L = letters.find(L => !L.held && p.x >= L.x && p.x <= L.x + L.w && inColumn(L, p.y));
    if (!L) return;
    L.mx.fill(0); L.mv.fill(0);
    L.held = { pull: 0, side: p.x < L.x + L.w / 2 ? 1 : -1, py: clampY(L, p.y), whine: whineStart(L) };
    rec.grab = L;
    wake();
  });
  function lift(e) {
    const rec = pointers.get(e.pointerId);
    if (!rec) return;
    if (rec.grab) { release(rec.grab); rec.grab = null; }
    if (e.pointerType !== 'mouse') pointers.delete(e.pointerId);
  }
  window.addEventListener('pointerup', lift);
  window.addEventListener('pointercancel', lift);

  // iPhones only allow sound to start from the end of a tap, so listen for every kind of gesture.
  for (const type of ['touchend', 'pointerup', 'mousedown', 'click', 'keydown']) {
    window.addEventListener(type, unlock, true);
  }
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && silentEl && awake) { const p = silentEl.play(); if (p) p.catch(() => {}); }
  });

  // The sound button steps to the next sound and its two colours.
  soundBtn.addEventListener('click', () => {
    mode = (mode + 1) % SOUNDS.length;
    soundBtn.textContent = SOUNDS[mode].name;
    applyColours();
    if (awake) SOUNDS[mode].play(130.8, 0.5, 0.6);
    for (const L of letters) kick(L, Math.random() < 0.5 ? 1 : -1, L.w * 0.1, 0.3 + Math.random() * 0.4);
    wake();
  });

  // Typing a letter that is in the word plays it too.
  const turn = {};
  window.addEventListener('keydown', e => {
    if (e.target === input || e.target === soundBtn || e.metaKey || e.ctrlKey || e.altKey || e.key.length !== 1) return;
    const key = e.key.toUpperCase();
    const same = letters.filter(L => L.ch === key);
    if (!same.length) return;
    turn[key] = ((turn[key] || 0) + 1) % same.length;
    pluck(same[turn[key]], Math.random() < 0.5 ? 1 : -1, e.repeat ? 0.15 : e.shiftKey ? 1 : 0.4, 0.2 + Math.random() * 0.6);
  });

  input.addEventListener('input', build);
  new ResizeObserver(build).observe(stage);
  if (document.fonts && document.fonts.load) {
    document.fonts.load('200px "Bungee"').then(build, () => {});
  }
  applyColours();
  build();
})();
</script>
</body>
</html>
